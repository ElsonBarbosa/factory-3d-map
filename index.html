<!doctype html>
<html lang="pt-BR" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Factory 3D Map — Planejamento industrial</title><meta name="description" content="Mapa tridimensional e planejamento de operações industriais.">
<link rel="icon" href="brand.svg" type="image/svg+xml"><link rel="stylesheet" href="src/map.css"></head>
<body><div class="app">
<main class="stage"><div id="mapViewport" class="map-viewport"><canvas id="cv" aria-label="Mapa tridimensional da fábrica"></canvas><div id="lbs"></div><div id="tip" class="tip"></div><div id="editorHandles"></div><div id="flowPorts"></div><button id="edRotateHandle" class="edrotate-handle" aria-label="Arraste para girar em passos de 90 graus">↻</button>
<div class="edinstall-overlay" id="edInstallOverlay"><div class="edinstall-dialog" role="dialog" aria-modal="true" aria-labelledby="edInstallTitle"><h3 id="edInstallTitle">Instalar equipamento</h3><div class="edinstall-visual" id="edInstallVisual"></div><div class="edinstall-context"><div><small>PROCESSO</small><strong id="edInstallProcess"></strong></div><div><small>ÁREA DE MANUFATURA</small><strong id="edInstallArea"></strong></div></div><div id="edInstallManual" hidden><label>Disposição<select id="edInstallMode"><option value="parallel">Paralela à esteira</option><option value="lateral">Lateral colada</option></select></label><label>Lado do posto<select id="edInstallSide"><option value="1">Lado A</option><option value="-1">Lado oposto</option></select></label><label>Direção da esteira<select id="edInstallFlow"><option value="auto">Acompanha o posto</option><option value="0">→ X positivo</option><option value="1">↑ Z negativo</option><option value="2">← X negativo</option><option value="3">↓ Z positivo</option></select></label></div><label for="edInstallId">ID do equipamento / estação</label><input id="edInstallId" maxlength="48" autocomplete="off" spellcheck="false" placeholder="Ex.: SPI-01"><div class="edinstall-note" id="edInstallError"></div><div class="edinstall-actions"><button id="edInstallCancel">Cancelar</button><button id="edInstallConfirm" class="primary">Adicionar ao projeto</button></div></div></div>
</div>
<div id="edDrawer" class="editor-drawer"><div class="edtoolbar-head"><strong>Construção</strong><div class="editor-tools"><button id="edFocus" title="Centralizar seleção">◎</button><button id="edCollapse" aria-expanded="true" aria-controls="edBody">Recolher</button><button id="edExit">Concluir</button></div></div><div id="edBody"></div></div></main>
<div class="project-bar"><img src="brand.svg" alt="" width="32" height="32"><div class="brand"><b>FACTORY <span>3D MAP</span></b><small>PLANEJAMENTO INDUSTRIAL / <span id="projectTitle">UNIDADE DEMONSTRATIVA</span></small></div><span class="save-state">● Salvamento local</span></div>
<nav class="map-tools" aria-label="Ferramentas do mapa"><button id="editToggle" title="Construir e editar">Construir</button><button data-tool="process" title="Processo">▱<small>Processo</small></button><button data-tool="areas" title="Áreas">▦<small>Áreas</small></button><button data-tool="machines" title="Equipamentos">⚙<small>Máquinas</small></button><button data-tool="stations" title="Estações">♙<small>Estações</small></button><button data-tool="flow" title="Esteiras">⇢<small>Fluxo</small></button><hr><button id="overview" data-home title="Visão geral">◎<small>Enquadrar</small></button><button id="topView" title="Planta superior">⊞<small>Planta</small></button><button id="themeSwitch" role="switch" aria-checked="true" aria-label="Alterar tema">◐<small>Tema</small></button></nav>
<div class="map-navigator"><label for="areaJump">LOCALIZAR ÁREA</label><select id="areaJump"><option value="">Visão geral do mapa</option></select><div class="nav-compass">N <span>↑</span><small>PLANTA / 3D</small></div></div>
<aside class="side" hidden><div id="al"></div><div id="lg"></div></aside>
<section id="panel" class="panel" hidden aria-label="Informações da seleção"></section><button id="closeInspector" title="Fechar informações">×</button>
<footer class="production-strip"><div class="demo-label"><i></i> DEMONSTRAÇÃO<small>Indicadores simulados</small></div><div id="kpis" class="kpis"></div><button id="monitorOverview">Relatório ↗</button></footer>
<div class="map-caption"><b>01 / MAPA OPERACIONAL</b><span class="hint">WASD desloca · arraste orbita · Shift move · roda aproxima</span></div>
</div><script src="vendor/three.min.js"></script><script src="src/models.js"></script><script src="src/monitor.js"></script><script src="src/construction.js"></script><script src="src/engine.js"></script><script src="src/shell.js"></script><script src="src/projects.js"></script></body></html>
